[package]
name = "dev-runner-mcp"
version = "0.1.0"
edition = "2021"
description = "DevRunner MCP Server - stdio proxy for Claude Code"
license = "MIT"

[workspace]

[[bin]]
name = "dev-runner-mcp"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
