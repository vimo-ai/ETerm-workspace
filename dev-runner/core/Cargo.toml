[package]
name = "dev-runner-core"
version = "0.1.0"
edition = "2021"
description = "DevRunner Core - Shared library for project detection, command generation, and output formatting"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Serialization (for JSON parsing: simctl, devicectl, package.json, config)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/Time (for output events, config timestamps)
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

# Utils
dirs = "5"  # For config paths (~/.vimo/dev-runner/)

# FFI
vimo-ffi = { git = "https://github.com/vimo-ai/vimo-rust" }

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
panic = "unwind"

# ============================================================================
# [patch] - 在 ETerm workspace 中使用本地 vimo-rust submodule
# ============================================================================
[patch."https://github.com/vimo-ai/vimo-rust"]
vimo-ffi = { path = "../../vimo-rust/vimo-ffi" }
