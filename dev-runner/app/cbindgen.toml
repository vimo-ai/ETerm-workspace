# cbindgen configuration for dev-runner-app

language = "C"
cpp_compat = false
include_guard = "DEV_RUNNER_H"
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not modify manually. */"

[defines]
# No special defines needed

[export]
prefix = ""
include = [
    "DevRunnerError",
]
exclude = [
    "DevRunnerHandle",  # Opaque type
]

[export.rename]

[enum]
rename_variants = "None"

[fn]
# Include all pub extern "C" functions
must_use = false
