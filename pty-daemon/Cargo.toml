[package]
name = "pty-daemon"
version = "0.1.0"
edition = "2021"
description = "PTY session persistence daemon for ETerm"

[[bin]]
name = "pty-daemon"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
